<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios - Sprinde Hub</title>

    <link rel="stylesheet" href="../css/base/variables.css" />
    <link rel="stylesheet" href="../css/base/reset.css" />
    <link rel="stylesheet" href="../css/base/global.css" />
    <link rel="stylesheet" href="../css/components/header.css" />
    <link rel="stylesheet" href="../css/components/user-modal.css" />
    <link rel="stylesheet" href="../css/components/notifications.css" />
    <link rel="stylesheet" href="../css/components/confirm-modal.css" />
    <link rel="stylesheet" href="../css/pages/users.css" />

    <script type="module" src="../js/pages/users.js"></script>
  </head>

  <body>
    <div id="header-container"></div>

    <main>
      <section class="users-table" aria-labelledby="users-title">
        <header class="users-table-header">
          <div>
            <a class="back-link" href="../index.html">Volver a proyectos</a>
            <h1 id="users-title">Usuarios</h1>
          </div>

          <div class="users-table-actions">
            <button class="button-new-user" id="button-new-user" type="button">
              Crear usuario
            </button>
            <button class="button-edit-user" id="button-edit-user" type="button">
              Modificar usuario
            </button>
            <button class="button-delete-user" id="button-delete-user" type="button">
              Borrar usuario
            </button>
          </div>
        </header>

        <label class="search" for="input-users">
          <span aria-hidden="true">⌕</span>
          <input
            id="input-users"
            type="search"
            placeholder="Buscar por usuario, email o rol"
          />
        </label>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th class="cell-centered">ID</th>
                <th>Email</th>
                <th>Nombre de usuario</th>
                <th class="cell-centered">Rol</th>
              </tr>
            </thead>
            <tbody id="users-table-body"></tbody>
          </table>
        </div>

        <div class="pagination">
          <label for="records-per-page">
            Mostrar
            <select id="records-per-page">
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            usuarios
          </label>

          <div>
            <button type="button" id="previous-page">Anterior</button>
            <span id="page-information" aria-live="polite"></span>
            <button type="button" id="next-page">Siguiente</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
