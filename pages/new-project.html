<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo Proyecto - Sprinde</title>

    <link rel="stylesheet" href="../css/base/reset.css" />
    <link rel="stylesheet" href="../css/base/variables.css" />
    <link rel="stylesheet" href="../css/base/global.css" />
    <link rel="stylesheet" href="../css/components/header.css" />
    <link rel="stylesheet" href="../css/components/notifications.css" />
    <link rel="stylesheet" href="../css/pages/new-project.css" />
  </head>

  <body>
    <div id="header-container"></div>

    <main class="new-project-page">
      <div class="new-project-topbar">
        <a class="back-link" href="../index.html">Volver a proyectos</a>
      </div>

      <header id="new-project-header">
        <h2 class="new-project-title">Nuevo proyecto</h2>
        <p id="new-project-description">Crea tu nuevo proyecto</p>
      </header>

      <form id="project-form">
        <fieldset>
          <legend>Datos del proyecto</legend>
          <label>
            Nombre del proyecto
            <input name="project-name" required />
          </label>
          <label>
            Descripción
            <input name="description" required />
          </label>
        </fieldset>
        <fieldset>
          <legend>Datos del cliente</legend>
          <button type="button" id="use-existing-client">
            Usar cliente existente
          </button>

          <div id="existing-client-container" hidden>
            <label>
              Cliente existente
              <select id="existing-client-select" name="existing-client-id">
                <option value="">Selecciona un cliente</option>
              </select>
            </label>
            <button type="button" id="cancel-existing-client">Cancelar</button>
          </div>
          <div id="new-client-fields">
            <label>
              Nombre del cliente asociado
              <input name="client-name" required />
            </label>
            <label>
              CIF
              <input name="cif" required />
            </label>
            <label>
              Teléfono
              <input name="phone" required />
            </label>
          </div>
        </fieldset>

        <fieldset
          data-collection="environments"
          data-template="environment-template"
        >
          <legend>Entornos</legend>

          <div class="collection-list"></div>

          <button type="button" data-action="add-item">Añadir entorno</button>
        </fieldset>

        <fieldset data-collection="services" data-template="service-template">
          <legend>Servicios</legend>

          <div class="collection-list"></div>

          <button type="button" data-action="add-item">Añadir servicio</button>
        </fieldset>

        <fieldset data-collection="commands" data-template="command-template">
          <legend>Comandos</legend>

          <div class="collection-list"></div>

          <button type="button" data-action="add-item">Añadir comando</button>
        </fieldset>

        <fieldset data-collection="notes" data-template="note-template">
          <legend>Notas</legend>

          <div class="collection-list"></div>

          <button type="button" data-action="add-item">Añadir nota</button>
        </fieldset>

        <fieldset
          data-collection="repositories"
          data-template="repository-template"
        >
          <legend>Repositorios</legend>

          <div class="collection-list"></div>

          <button type="button" data-action="add-item">
            Añadir repositorio
          </button>
        </fieldset>

        <fieldset data-collection="domains" data-template="domain-template">
          <legend>Dominios</legend>

          <div class="collection-list"></div>

          <button type="button" data-action="add-item">Añadir dominio</button>
        </fieldset>

        <fieldset data-collection="links" data-template="link-template">
          <legend>Documentación</legend>

          <div class="collection-list"></div>

          <button type="button" data-action="add-item">
            Añadir documentación
          </button>
        </fieldset>
        <button id="save-project" type="submit">Guardar proyecto</button>
      </form>

      <template id="environment-template">
        <section class="collection-item">
          <label>
            Tipo
            <select name="environment-type" data-field="type" required>
              <option value="">Selecciona un entorno</option>
              <option value="development">Desarrollo</option>
              <option value="test">Test</option>
              <option value="staging">Staging</option>
              <option value="production">Producción</option>
            </select>
          </label>

          <label>
            URL
            <input
              name="environment-url"
              data-field="url"
              type="url"
              placeholder="https://erp.acme.es"
              required
            />
          </label>

          <button type="button" data-action="remove-item">
            Eliminar entorno
          </button>
        </section>
      </template>

      <template id="repository-template">
        <section class="collection-item">
          <label>
            Tipo
            <select name="repository-type" data-field="type" required>
              <option value="">Selecciona un tipo</option>
              <option value="frontend">Frontend</option>
              <option value="backend">Backend</option>
              <option value="devops">DevOps</option>
              <option value="qa">QA</option>
            </select>
          </label>

          <label>
            URL del repositorio
            <input
              name="repository-url"
              data-field="url"
              type="url"
              placeholder="https://github.com/organizacion/repositorio"
              required
            />
          </label>

          <button type="button" data-action="remove-item">
            Eliminar repositorio
          </button>
        </section>
      </template>

      <template id="service-template">
        <section class="collection-item">
          <label>
            Nombre del servicio
            <input
              name="service-name"
              data-field="name"
              type="text"
              placeholder="Ej.: Hetzner"
              required
            />
          </label>

          <button type="button" data-action="remove-item">
            Eliminar servicio
          </button>
        </section>
      </template>

      <template id="domain-template">
        <section class="collection-item">
          <label>
            URL del dominio
            <input
              name="domain-url"
              data-field="url"
              type="url"
              placeholder="https://erp.acme.es"
              required
            />
          </label>

          <button type="button" data-action="remove-item">
            Eliminar dominio
          </button>
        </section>
      </template>

      <template id="command-template">
        <section class="collection-item">
          <label>
            Nombre del comando
            <input
              name="command-name"
              data-field="name"
              type="text"
              placeholder="Ej.: Iniciar frontend"
              required
            />
          </label>

          <label>
            Instrucción
            <input
              name="command-instruction"
              data-field="instruction"
              type="text"
              placeholder="Ej.: npm run dev"
              required
            />
          </label>

          <button type="button" data-action="remove-item">
            Eliminar comando
          </button>
        </section>
      </template>

      <template id="link-template">
        <section class="collection-item">
          <label>
            Título
            <input
              name="link-title"
              data-field="title"
              type="text"
              placeholder="Ej.: Guía de despliegue"
              required
            />
          </label>

          <label>
            URL
            <input
              name="link-url"
              data-field="url"
              type="url"
              placeholder="https://docs.example.com/guia"
              required
            />
          </label>

          <button type="button" data-action="remove-item">
            Eliminar documentación
          </button>
        </section>
      </template>

      <template id="note-template">
        <section class="collection-item">
          <label>
            Descripción
            <input
              name="note-description"
              data-field="description"
              type="text"
              placeholder="Ej.: Acceso de producción"
              required
            />
          </label>

          <label>
            Contenido
            <textarea
              name="note-content"
              data-field="content"
              rows="4"
              placeholder="Escribe la nota..."
              required
            ></textarea>
          </label>

          <button type="button" data-action="remove-item">Eliminar nota</button>
        </section>
      </template>
    </main>
    <script type="module" src="../js/pages/new-project.js"></script>
  </body>
</html>
