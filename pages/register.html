<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SprindeHub</title>
    <link rel="stylesheet" href="../css/base/variables.css" />
    <link rel="stylesheet" href="../css/base/reset.css" />
    <link rel="stylesheet" href="../css/pages/login-register.css" />
    <link rel="stylesheet" href="../css/components/button.css" />

    <script type="module" src="../js/pages/register.js"></script>
  </head>
  <header>
    <h1>REGISTRO DESACTIVADO</h1>
  </header>

  <body>
    <main class="register-page">
      <section class="register-card">
        <h1 id="register-title">Sprinde Hub</h1>

        <form id="register-form">
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-field">
            <label for="username">Nombre de usuario</label>
            <input type="text" id="username" name="username" required />
          </div>

          <div class="form-field">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              minlength="10"
              required
            />
          </div>
          <button type="submit" class="button">Registrarse</button>
          <p id="register-message" role="status"></p>
        </form>
      </section>
    </main>
  </body>
</html>
