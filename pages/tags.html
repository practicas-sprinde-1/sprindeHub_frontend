<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dispositivos - Sprinde Hub</title>

    <link rel="stylesheet" href="../css/base/variables.css" />
    <link rel="stylesheet" href="../css/base/reset.css" />
    <link rel="stylesheet" href="../css/base/global.css" />
    <link rel="stylesheet" href="../css/components/header.css" />
    <link rel="stylesheet" href="../css/components/notifications.css" />
    <link rel="stylesheet" href="../css/pages/clients.css" />
    <link rel="stylesheet" href="../css/pages/tags.css" />
    <link rel="stylesheet" href="../css/components/client-create-modal.css" />

    <script type="module" src="../js/pages/tags.js"></script>
  </head>

  <body>
    <div id="header-container"></div>

    <main>
      <section class="clients-table tags-table">
        <header class="clients-table-header">
          <div>
            <a class="back-link" href="../index.html">Volver a proyectos</a>
            <h1 id="tags-title">Dispositivos</h1>
          </div>

          <div class="tags-table-actions">
            <button
              class="button-new-client"
              id="button-new-client"
              type="button"
            >
              + Nuevo Cliente
            </button>
            <button class="button-new-tag" id="button-new-tag" type="button">
              + Nuevo dispositivo
            </button>
          </div>
        </header>

        <div class="table-actions">
          <label class="search" for="input-tags">
            <span>⌕</span>
            <input
              id="input-tags"
              type="search"
              maxlength="120"
              placeholder="Buscar por dispositivo, marca, modelo, MAC o IP"
            />
          </label>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Cliente</th>
                <th class="cell-centered">Dispositivo (tipo)</th>
                <th class="cell-centered">Marca</th>
                <th class="cell-centered">Modelo</th>
                <th class="cell-centered">Dirección MAC</th>
                <th class="cell-centered">Dirección IP</th>
              </tr>
            </thead>
            <tbody id="tags-table-body"></tbody>
          </table>
        </div>

        <p id="tags-status" role="status" aria-live="polite">
          Cargando dispositivos...
        </p>

        <div class="pagination">
          <label for="records-per-page">
            Mostrar
            <select id="records-per-page">
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            dispositivos
          </label>

          <div>
            <button type="button" id="previous-page" disabled>Anterior</button>
            <span id="page-information"></span>
            <button type="button" id="next-page" disabled>Siguiente</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
