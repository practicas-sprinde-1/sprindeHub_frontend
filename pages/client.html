<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cliente</title>

    <link rel="stylesheet" href="../css/base/reset.css" />
    <link rel="stylesheet" href="../css/base/variables.css" />
    <link rel="stylesheet" href="../css/base/global.css" />
    <link rel="stylesheet" href="../css/components/header.css" />
    <link rel="stylesheet" href="../css/pages/client.css" />
  </head>
  <body>
    <div id="header-container"></div>

    <main class="client-page">
      <div class="client-topbar">
        <a class="back-link" href="../index.html">Volver a proyectos</a>

        <div class="client-actions">
          <button class="button-edit-client" type="button">
            Modificar cliente
          </button>
          <button class="button-delete-client" type="button">
            Borrar cliente
          </button>
        </div>
      </div>

      <p id="client-error" hidden></p>

      <section id="client-detail" hidden>
        <header class="client-header">
          <h1 class="client-title" id="client-title"></h1>
          <span id="client-status" class="client-status"></span>
        </header>

        <section>
          <h2>Proyectos</h2>
          <ul id="client-list-projects"></ul>
        </section>

        <dl class="client-data">
          <div>
            <dt>CIF</dt>
            <dd id="client-cif"></dd>
          </div>
          <div>
            <dt>Teléfono</dt>
            <dd id="client-phone"></dd>
          </div>
        </dl>
      </section>
    </main>
    <script type="module" src="../js/pages/client.js"></script>
    2.
  </body>
</html>
